<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geodesic Dome LED Game Simulator</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #0f1319;
    --panel2: #0c1018;
    --text: #e8eaf0;
    --muted: #8892b0;
    --accent: #64ffda;
    --accent2: #7c3aed;
    --line: #1e2433;
    --btn: #151c28;
    --btnHover: #1c2536;
    --btnActive: #2563eb;
    --team1: #f43f5e;
    --team2: #3b82f6;
    --success: #10b981;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #panel {
    width: 320px;
    min-width: 320px;
    flex-shrink: 0;
    padding: 20px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .header h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header .icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .game-button {
    width: 100%;
    padding: 14px 16px;
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .game-button:hover { 
    background: var(--btnHover);
    border-color: var(--accent);
    transform: translateX(4px);
  }
  .game-button.active { 
    background: var(--btnActive);
    border-color: var(--btnActive);
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
  }
  .game-button .emoji { font-size: 18px; }

  #statsPanel {
    background: linear-gradient(135deg, rgba(100, 255, 218, 0.1), rgba(124, 58, 237, 0.1));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-item {
    text-align: center;
    padding: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .stat-value.team1 { color: var(--team1); }
  .stat-value.team2 { color: var(--team2); }
  .stat-value.combo { color: var(--warning); }

  #turnIndicator {
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    display: none;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  #turnIndicator.team1 {
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(244, 63, 94, 0.1));
    color: var(--team1);
    display: block;
  }

  #turnIndicator.team2 {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
    color: var(--team2);
    display: block;
  }

  .row { 
    display: flex;
    gap: 10px;
  }
  
  .row button {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--btn);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  
  .row button:hover {
    background: var(--btnHover);
    border-color: var(--accent);
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    margin-top: 8px;
  }

  .control {
    font-size: 13px;
    color: var(--muted);
  }
  .control label { 
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .control input[type="range"] { 
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: var(--line);
    border-radius: 3px;
    outline: none;
  }
  .control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .control input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
  }

  .toggle {
    width: 44px;
    height: 24px;
    background: var(--line);
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
  }

  .toggle.active {
    background: var(--accent);
  }

  .toggle::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.3s;
  }

  .toggle.active::after {
    transform: translateX(20px);
  }

  #rules {
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: rgba(0,0,0,0.2);
    padding: 14px;
    border-radius: 10px;
    border-left: 3px solid var(--accent);
  }

  #rules b {
    color: var(--text);
    font-weight: 600;
  }

  #notification {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(16, 185, 129, 0.95);
    color: white;
    padding: 14px 28px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 16px;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
  }

  #notification.show {
    transform: translateX(-50%) translateY(0);
  }

  #notification.error {
    background: rgba(239, 68, 68, 0.95);
    box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4);
  }

  #notification.combo {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    box-shadow: 0 10px 40px rgba(245, 158, 11, 0.4);
  }

  canvas {
    flex: 1;
    background: var(--panel2);
    touch-action: none;
    display: block;
  }

  .credits {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>

<body>
  <div id="panel">
    <div class="header">
      <div class="icon">◇</div>
      <h2>Dome Games</h2>
    </div>

    <div>
      <button class="game-button active" data-game="chain">
        <span class="emoji">⚡</span> Chain Reaction
      </button>

      </button>
      <button class="game-button" data-game="pulsewars">
        <span class="emoji">⚔️</span> Pulse Wars
      </button>
    </div>

    <div id="rules"></div>

    <div id="statsPanel">
      <div class="stats-grid">
        <div class="stat-item" id="chainProgress">
          <div class="stat-value" id="progressVal">0/26</div>
          <div class="stat-label">Hubs Lit</div>
        </div>
        <div class="stat-item" id="chainTimer">
          <div class="stat-value combo" id="timerVal">30s</div>
          <div class="stat-label">Time Left</div>
        </div>
        <div class="stat-item" id="team1Stat">
          <div class="stat-value team1" id="team1Score">0</div>
          <div class="stat-label">Team Red</div>
        </div>

          <div class="stat-value team2" id="team2Score">0</div>

        </div>
      </div>
      <div id="turnIndicator">Team Red's Turn</div>

        <div id="timerFill" style="width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #22c55e); border-radius: 4px; transition: width 0.1s linear;"></div>

    <button id="nextRoundBtn" style="width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px; background: linear-gradient(135deg, #10b981, #22c55e); color: white; cursor: pointer; font-size: 14px; font-weight: 600; display: none;">⚡ Next Round</button>

    <div class="section-title">Settings</div>

    <div class="toggle-row">

      <div class="toggle active" id="soundToggle"></div>

      <span>Auto-Rotate</span>
      <div class="toggle" id="autoRotateToggle"></div>
    </div>

    <div class="credits">
      Drag to rotate • Click hubs to play
    </div>
  </div>

  <div id="notification"></div>
  <canvas id="canvas"></canvas>

<script>
/* ============================================================
   CONFIG
============================================================ */
const LEDS_PER_EDGE = 24;
let HUB_RADIUS = 10;
let LED_DECAY = 0.92;
let PULSE_SPEED = 1.0;
let SOUND_ENABLED = true;
let GLOW_ENABLED = true;
let AUTO_ROTATE = false;

// Game state
let score = 0;
let combo = 1;
let comboTimer = 0;
const COMBO_TIMEOUT = 2000;

const RULES = {
  chain: `<b>Chain Reaction</b><br>
🎯 Hit the glowing target hub!<br>
Complete rounds faster each time.<br>
Early rounds: targets nearby.<br>
Later rounds: targets anywhere!`,
  resonance: `<b>Resonance</b><br>
Tap hubs to create colorful waves!<br>
Waves flow across the dome structure.<br>
When waves collide = ✨ bonus points!<br>
Create patterns and chain reactions!`,
  pulsewars: `<b>Pulse Wars</b><br>
⚔️ Real-time territory race!<br>
🔴 Red starts left, 🔵 Blue starts right<br>
Tap hubs next to your territory to charge!<br>
Fill the LED ring to capture.<br>
Race to control the majority!`
};

// Pulse Wars state
let pulseWarsTimer = 0;
let gameOver = false;
const RING_LEDS = 12; // Number of LEDs in each hub's ring
const CHARGE_PER_TAP = 2; // LEDs lit per tap (reduced for balance)
const CHARGE_DECAY = 0.03; // Decay of contested hubs

// Chain Reaction state
const CHAIN_BASE_TIME = 45; // Base time for round 1
const CHAIN_TIME_REDUCTION = 5; // Seconds reduced per round
const CHAIN_MIN_TIME = 15; // Minimum time limit
let chainTimeRemaining = CHAIN_BASE_TIME;
let chainTimeLimit = CHAIN_BASE_TIME; // Current round's time limit
let chainStarted = false;
let chainWon = false;
let chainLost = false;
let celebrationTime = 0; // For win/lose animation timing
let chainRound = 1; // Current round number
let chainTargetHub = 0; // Current target hub to hit
let lastLitHub = null; // Track the last hub that was lit

// Resonance wave system
const waves = []; // Active waves: {hubId, intensity, color, hue}
const WAVE_SPEED = 0.15; // How fast waves propagate
const WAVE_FADE = 0.85; // How fast waves fade (lower = faster fade)
const WAVE_PROPAGATE_THRESHOLD = 0.3; // Minimum intensity to propagate

/* ============================================================
   AUDIO SYSTEM
============================================================ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, duration = 0.15, type = 'sine', volume = 0.3) {
  if (!SOUND_ENABLED || !audioCtx) return;
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playSuccess() {
  playTone(523.25, 0.1); // C5
  setTimeout(() => playTone(659.25, 0.1), 50); // E5
  setTimeout(() => playTone(783.99, 0.15), 100); // G5
}

function playCombo(level) {
  const baseFreq = 400 + (level * 50);
  playTone(baseFreq, 0.2, 'triangle', 0.4);
}

function playError() {
  playTone(200, 0.3, 'sawtooth', 0.2);
}

function playClick() {
  playTone(800, 0.05, 'sine', 0.1);
}

function playVictorySound() {
  // Triumphant ascending arpeggio
  const notes = [523, 659, 784, 1047, 1319, 1568]; // C E G C E G (octave up)
  notes.forEach((freq, i) => {
    setTimeout(() => playTone(freq, 0.3, 'sine', 0.4), i * 100);
  });
}

function playFailSound() {
  // Descending sad notes
  playTone(400, 0.3, 'sawtooth', 0.3);
  setTimeout(() => playTone(350, 0.3, 'sawtooth', 0.3), 150);
  setTimeout(() => playTone(300, 0.4, 'sawtooth', 0.4), 300);
  setTimeout(() => playTone(200, 0.6, 'sawtooth', 0.5), 500);
}

/* ============================================================
   NOTIFICATION SYSTEM
============================================================ */
const notification = document.getElementById('notification');
let notificationTimeout = null;

function showNotification(text, type = 'success') {
  if (notificationTimeout) clearTimeout(notificationTimeout);
  
  notification.textContent = text;
  notification.className = type;
  
  requestAnimationFrame(() => {
    notification.classList.add('show');
  });
  
  notificationTimeout = setTimeout(() => {
    notification.classList.remove('show');
  }, 2000);
}

/* ============================================================
   PARTICLE SYSTEM
============================================================ */
const particles = [];

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
      size: 3 + Math.random() * 4
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= 0.025;
    p.size *= 0.97;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color.replace(')', `,${p.life})`).replace('rgb', 'rgba');
    ctx.fill();
  }
}

/* ============================================================
   CANVAS – responsive + HiDPI correct
============================================================ */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

let DPR = 1;
function resizeCanvasToDisplaySize() {
  const rect = canvas.getBoundingClientRect();
  DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));

  const w = Math.max(1, Math.floor(rect.width));
  const h = Math.max(1, Math.floor(rect.height));

  const targetW = w * DPR;
  const targetH = h * DPR;

  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
  // draw in CSS pixels
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resizeCanvasToDisplaySize).observe(canvas);
window.addEventListener("resize", resizeCanvasToDisplaySize);
resizeCanvasToDisplaySize();

/* ============================================================
   MATH
============================================================ */
function vecAdd(a,b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function vecScale(a,s){ return [a[0]*s, a[1]*s, a[2]*s]; }
function vecLen(a){ return Math.hypot(a[0],a[1],a[2]); }
function vecNorm(a){
  const l = vecLen(a) || 1;
  return [a[0]/l, a[1]/l, a[2]/l];
}
function midpoint(a,b){ return vecScale(vecAdd(a,b), 0.5); }

/* ============================================================
   GAME LOGIC (declare before buildDome)
============================================================ */
let activeHub = 0;
let turn = 1;

/* ============================================================
   DOME GRAPH – 2V ICOSAHEDRON, NORMALIZED, HEMISPHERE CUT
============================================================ */
let nodes = [];
let edges = [];

function buildDome() {
  nodes = [];
  edges = [];

  const t = (1 + Math.sqrt(5)) / 2;

  const baseVerts = [
    [-1, t, 0],[1, t, 0],[-1,-t,0],[1,-t,0],
    [0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],
    [t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]
  ].map(vecNorm);

  const faces = [
    [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
    [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
    [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
    [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
  ];

  const vertMap = new Map();
  const quant = (v) => v.map(x => x.toFixed(5)).join(",");

  function addVert(vUnit) {
    if (vUnit[2] < 0) return null; // hemisphere cut
    const key = quant(vUnit);
    if (!vertMap.has(key)) {
      const id = nodes.length;
      vertMap.set(key, id);
      nodes.push({
        id,
        p3: vUnit,        // 3D unit position
        sx: 0, sy: 0,     // screen coords computed each frame
        pressedBy: new Set(),
        owner: null,
        pulseIntensity: 0,
        // Pulse Wars state
        capturedBy: null, // 1 = Red, 2 = Blue, null = neutral
        chargeTeam: null, // Which team is currently charging this
        ringCharge: 0     // 0 to RING_LEDS - how many LEDs are lit
      });
    }
    return vertMap.get(key);
  }

  function addEdge(a,b) {
    if (a === null || b === null) return;
    if (a === b) return;
    if (edges.some(e => (e.a===a && e.b===b) || (e.a===b && e.b===a))) return;
    edges.push({ a, b, leds: Array.from({length: LEDS_PER_EDGE}, () => 0) });
  }

  faces.forEach(f => {
    const v0 = baseVerts[f[0]];
    const v1 = baseVerts[f[1]];
    const v2 = baseVerts[f[2]];

    const m01 = vecNorm(midpoint(v0,v1));
    const m12 = vecNorm(midpoint(v1,v2));
    const m20 = vecNorm(midpoint(v2,v0));

    const verts = [v0, v1, v2, m01, m12, m20];
    const ids = verts.map(addVert);

    const connections = [
      [0,3],[3,5],[5,0],
      [3,1],[1,4],[4,3],
      [5,4],[4,2],[2,5]
    ];
    connections.forEach(([a,b]) => addEdge(ids[a], ids[b]));
  });
}

buildDome();
activeHub = Math.floor(Math.random() * nodes.length);

/* ============================================================
   UI
============================================================ */
const rulesEl = document.getElementById("rules");
const buttons = document.querySelectorAll(".game-button");
const resetBtn = document.getElementById("resetBtn");
const soundToggle = document.getElementById("soundToggle");
const progressValEl = document.getElementById("progressVal");
const timerValEl = document.getElementById("timerVal");
const chainProgressEl = document.getElementById("chainProgress");
const chainTimerEl = document.getElementById("chainTimer");
const timerBarEl = document.getElementById("timerBar");
const timerFillEl = document.getElementById("timerFill");
const team1ScoreEl = document.getElementById("team1Score");
const team2ScoreEl = document.getElementById("team2Score");
const team1StatEl = document.getElementById("team1Stat");
const team2StatEl = document.getElementById("team2Stat");
const turnIndicator = document.getElementById("turnIndicator");
const nextRoundBtn = document.getElementById('nextRoundBtn');

let game = "chain";
rulesEl.innerHTML = RULES.chain;
updateUI();

function resetGameState() {
  nodes.forEach(n => { 
    n.owner = null; 
    n.pressedBy.clear(); 
    n.pulseIntensity = 0;
    n.capturedBy = null;
    n.chargeTeam = null;
    n.ringCharge = 0;
    n.chainLit = false; // Chain Reaction lit state
  });
  edges.forEach(e => {
    e.leds.fill(0);
    e.hue = 0;
  });
  turn = 1;
  score = 0;
  combo = 1;
  comboTimer = 0;
  particles.length = 0;
  waves.length = 0;
  gameOver = false;
  pulseWarsTimer = 0;
  
  // Chain Reaction reset
  chainTimeLimit = Math.max(CHAIN_MIN_TIME, CHAIN_BASE_TIME - (chainRound - 1) * CHAIN_TIME_REDUCTION);
  chainTimeRemaining = chainTimeLimit;
  chainStarted = false;
  chainWon = false;
  chainLost = false;
  celebrationTime = 0;
  lastLitHub = null;
  
  // Pick first target for Chain Reaction
  if (game === 'chain') {
    chainTargetHub = Math.floor(Math.random() * nodes.length);
  }
  
  // Set starting positions for Pulse Wars
  if (game === 'pulsewars') {
    initPulseWarsStartPositions();
  }
  
  updateUI();
}

// Initialize Pulse Wars with teams at opposite ends
function initPulseWarsStartPositions() {
  // Find leftmost and rightmost nodes based on 3D x-coordinate
  let leftmost = null, rightmost = null;
  let minX = Infinity, maxX = -Infinity;
  
  for (const n of nodes) {
    if (n.p3[0] < minX) { minX = n.p3[0]; leftmost = n; }
    if (n.p3[0] > maxX) { maxX = n.p3[0]; rightmost = n; }
  }
  
  // Red starts left, Blue starts right
  if (leftmost) {
    leftmost.capturedBy = 1;
    leftmost.ringCharge = RING_LEDS;
  }
  if (rightmost) {
    rightmost.capturedBy = 2;
    rightmost.ringCharge = RING_LEDS;
  }
}

// Pick next target hub based on round difficulty
// Early rounds: prefer nearby hubs
// Later rounds: more random/distant hubs
function pickNextTarget(currentHubId, round) {
  const unlitHubs = nodes.filter(n => !n.chainLit);
  if (unlitHubs.length === 0) return currentHubId;
  
  // Calculate "nearby" probability based on round
  // Round 1: 90% nearby, Round 5+: 10% nearby (mostly random)
  const nearbyChance = Math.max(0.1, 1 - (round - 1) * 0.2);
  
  if (Math.random() < nearbyChance) {
    // Pick a nearby hub - find neighbors of recently lit hubs
    const currentHub = nodes[currentHubId];
    
    // Get all edges connected to current hub
    const neighbors = [];
    for (const e of edges) {
      if (e.a === currentHubId && !nodes[e.b].chainLit) neighbors.push(e.b);
      if (e.b === currentHubId && !nodes[e.a].chainLit) neighbors.push(e.a);
    }
    
    // If we have unlit neighbors, pick one
    if (neighbors.length > 0) {
      return neighbors[Math.floor(Math.random() * neighbors.length)];
    }
    
    // No unlit neighbors - find closest unlit hub by 3D distance
    let closest = unlitHubs[0];
    let closestDist = Infinity;
    for (const n of unlitHubs) {
      const dx = n.p3[0] - currentHub.p3[0];
      const dy = n.p3[1] - currentHub.p3[1];
      const dz = n.p3[2] - currentHub.p3[2];
      const dist = dx*dx + dy*dy + dz*dz;
      if (dist < closestDist) {
        closestDist = dist;
        closest = n;
      }
    }
    return closest.id;
  } else {
    // Pick a random unlit hub (harder - could be anywhere)
    return unlitHubs[Math.floor(Math.random() * unlitHubs.length)].id;
  }
}

/* ============================================================
   INPUT – multi-touch hub interaction
============================================================ */
const pointerToHub = new Map(); // pointerId -> hubId (or null)
let hoveredHub = null;

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function hitTestHub(x,y) {
  let best = null;
  let bestD = HUB_RADIUS * 1.5; // Slightly larger hit area
  for (const n of nodes) {
    const d = Math.hypot(n.sx - x, n.sy - y);
    if (d <= bestD) { bestD = d; best = n.id; }
  }
  return best;
}

function setHubPressedBy(hubId, pointerId, down) {
  const n = nodes[hubId];
  if (down) {
    const wasEmpty = n.pressedBy.size === 0;
    n.pressedBy.add(pointerId);
    if (wasEmpty) onPress(n);
  } else {
    n.pressedBy.delete(pointerId);
  }
}

canvas.addEventListener("pointerdown", (e) => {
  initAudio();
  canvas.setPointerCapture(e.pointerId);

  const {x,y} = getPointerPos(e);
  const hubId = hitTestHub(x,y);
  pointerToHub.set(e.pointerId, hubId);

  if (hubId !== null) {
    setHubPressedBy(hubId, e.pointerId, true);
  }
});

canvas.addEventListener("pointermove", (e) => {
  const {x,y} = getPointerPos(e);
  
  // Update hover state
  hoveredHub = hitTestHub(x, y);
  canvas.style.cursor = hoveredHub !== null ? 'pointer' : 'grab';
  
  if (!pointerToHub.has(e.pointerId)) return;

  const prev = pointerToHub.get(e.pointerId);
  const next = hitTestHub(x,y);

  if (prev !== next) {
    if (prev !== null) setHubPressedBy(prev, e.pointerId, false);
    pointerToHub.set(e.pointerId, next);
    if (next !== null) setHubPressedBy(next, e.pointerId, true);
  }
});

canvas.addEventListener("pointerup", (e) => {
  const hubId = pointerToHub.get(e.pointerId);
  if (hubId !== null) setHubPressedBy(hubId, e.pointerId, false);
  pointerToHub.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
});

canvas.addEventListener("pointercancel", (e) => {
  const hubId = pointerToHub.get(e.pointerId);
  if (hubId !== null) setHubPressedBy(hubId, e.pointerId, false);
  pointerToHub.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
});

/* ============================================================
   DRAG TO ROTATE (mouse + touch)
   – drag empty space rotates
============================================================ */
let rotY = 0;     // yaw (camera)
let rotX = -0.55; // pitch (camera)
let rotZ = 0;     // dome spin (around dome's vertical axis)
let isRotating = false;
let rotatePointerId = null;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", (e) => {
  const { x, y } = getPointerPos(e);
  const hubId = hitTestHub(x, y);

  // only start rotation if not pressing a hub
  if (hubId === null && !isRotating) {
    isRotating = true;
    rotatePointerId = e.pointerId;
    lastX = x;
    lastY = y;
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (!isRotating || e.pointerId !== rotatePointerId) return;

  const { x, y } = getPointerPos(e);
  const dx = x - lastX;
  const dy = y - lastY;
  lastX = x;
  lastY = y;

  rotY += dx * 0.008;
  rotX += dy * 0.008;
});

function endRotate(e) {
  if (e.pointerId !== rotatePointerId) return;
  isRotating = false;
  rotatePointerId = null;
}

canvas.addEventListener("pointerup", endRotate);
canvas.addEventListener("pointercancel", endRotate);

/* ============================================================
   GAME LOGIC
============================================================ */
function onPress(n) {
  if (game === "chain") {
    // Don't allow interaction during win/lose animation
    if (chainWon || chainLost) return;
    
    // Start timer on first tap
    if (!chainStarted) {
      chainStarted = true;
      showNotification(`⏱️ Round ${chainRound} - GO!`, 'combo');
    }
    
    // Check if this is the target hub
    if (n.id === chainTargetHub && !n.chainLit) {
      // Correct hit!
      n.chainLit = true;
      lastLitHub = n.id;
      emitPulse(n.id);
      
      // Get count of lit hubs
      const litCount = nodes.filter(node => node.chainLit).length;
      
      // Colorful particles - rainbow progression
      const hue = (litCount / nodes.length) * 120;
      spawnParticles(n.sx, n.sy, `hsl(${hue}, 80%, 60%)`, 20);
      playSuccess();
      
      // Check for round win
      if (litCount === nodes.length) {
        chainWon = true;
        celebrationTime = 0;
        showNotification(`🎉 Round ${chainRound} Complete!`, 'success');
        playVictorySound();
      } else {
        // Pick next target based on round difficulty
        chainTargetHub = pickNextTarget(n.id, chainRound);
      }
      
      updateUI();
    } else if (n.chainLit) {
      // Already lit - small feedback
      playClick();
      spawnParticles(n.sx, n.sy, 'rgba(255, 255, 255, 0.3)', 3);
    } else {
      // Wrong hub - penalty feedback
      playError();
      spawnParticles(n.sx, n.sy, 'rgba(239, 68, 68, 0.6)', 8);
      showNotification('🎯 Find the glowing target!', 'error');
    }
  } else if (game === "resonance") {
    // Create a new wave from this hub
    const hue = Math.random() * 360;
    createWave(n.id, 1.5, hue);
    
    // Check for wave collisions at this hub
    checkWaveCollision(n);
    
    // Visual and audio
    const color = `hsl(${hue}, 80%, 60%)`;
    spawnParticles(n.sx, n.sy, color, 15);
    playTone(300 + (hue / 360) * 400, 0.2, 'sine', 0.25);
    score += 5;
    updateUI();
  } else if (game === "pulsewars") {
    if (gameOver) return;
    
    // Find which team(s) this hub is adjacent to
    const adjacentTeams = getAdjacentTeams(n.id);
    
    if (adjacentTeams.length === 0) {
      playError();
      showNotification('Must be next to your territory!', 'error');
      return;
    }
    
    // If hub is already captured, ignore
    if (n.capturedBy !== null) {
      playClick();
      return;
    }
    
    // Determine which team is charging based on current charge or first adjacent
    let chargingTeam;
    if (n.chargeTeam !== null) {
      // Continue with current charging team if they're still adjacent
      if (adjacentTeams.includes(n.chargeTeam)) {
        chargingTeam = n.chargeTeam;
      } else {
        // Team lost adjacency, reset and use new team
        n.ringCharge = 0;
        chargingTeam = adjacentTeams[0];
      }
    } else {
      // New charge - if contested, alternate based on existing charge
      chargingTeam = adjacentTeams[0];
    }
    
    chargeHub(n.id, chargingTeam);
  }
}

// Get which teams have captured hubs adjacent to this hub
function getAdjacentTeams(hubId) {
  const teams = new Set();
  const n = nodes[hubId];
  
  // Can't charge already captured hubs
  if (n.capturedBy !== null) return [];
  
  for (const e of edges) {
    let neighborId = null;
    if (e.a === hubId) neighborId = e.b;
    else if (e.b === hubId) neighborId = e.a;
    
    if (neighborId !== null) {
      const neighbor = nodes[neighborId];
      if (neighbor.capturedBy !== null) {
        teams.add(neighbor.capturedBy);
      }
    }
  }
  return Array.from(teams);
}

// Check if a hub is on the frontier for a team (adjacent to their territory)
function isOnFrontier(hubId, team) {
  const n = nodes[hubId];
  if (n.capturedBy !== null) return false;
  return getAdjacentTeams(hubId).includes(team);
}

// Pulse Wars: Charge a hub (real-time, no turns)
function chargeHub(hubId, team) {
  if (game !== 'pulsewars' || gameOver) return;
  
  const n = nodes[hubId];
  
  // If a different team was charging, they're contesting - reduce their charge
  if (n.chargeTeam !== null && n.chargeTeam !== team) {
    // Contested! Remove charge instead
    n.ringCharge = Math.max(0, n.ringCharge - CHARGE_PER_TAP);
    if (n.ringCharge <= 0) {
      n.chargeTeam = null;
    }
    playTone(200, 0.1, 'sawtooth', 0.15);
    spawnParticles(n.sx, n.sy, 'rgb(255, 255, 255)', 6);
    updateUI();
    return;
  }
  
  n.chargeTeam = team;
  n.ringCharge = Math.min(RING_LEDS, n.ringCharge + CHARGE_PER_TAP);
  
  // Play charging sound (pitch increases with charge)
  const pitch = 300 + (n.ringCharge / RING_LEDS) * 400;
  playTone(pitch, 0.08, 'sine', 0.15);
  
  // Check for capture
  if (n.ringCharge >= RING_LEDS) {
    // Captured!
    n.capturedBy = team;
    n.ringCharge = RING_LEDS;
    n.chargeTeam = null;
    
    const color = team === 1 ? 'rgb(244, 63, 94)' : 'rgb(59, 130, 246)';
    spawnParticles(n.sx, n.sy, color, 25);
    emitPulse(n.id);
    playSuccess();
  }
  
  updateUI();
}

// Pulse Wars: Update (decay uncharged hubs slightly)
function updatePulseWars(dt) {
  if (game !== 'pulsewars' || gameOver) return;
  
  // Slow decay of partially charged hubs
  for (const n of nodes) {
    if (n.capturedBy === null && n.ringCharge > 0) {
      n.ringCharge = Math.max(0, n.ringCharge - CHARGE_DECAY);
      if (n.ringCharge <= 0) {
        n.chargeTeam = null;
      }
    }
  }
}

// Resonance: Create a wave at a hub
function createWave(hubId, intensity, hue) {
  // Check if wave already exists at this hub
  const existing = waves.find(w => w.hubId === hubId);
  if (existing) {
    existing.intensity = Math.min(2, existing.intensity + intensity);
    // Blend hues
    existing.hue = (existing.hue + hue) / 2;
  } else {
    waves.push({ hubId, intensity, hue, age: 0 });
  }
  
  // Emit LED pulse from this hub
  emitPulseWithColor(hubId, hue);
}

// Emit pulse with specific color (stored as hue)
function emitPulseWithColor(id, hue) {
  for (const e of edges) {
    if (e.a === id) {
      e.leds[0] = Math.min(2, e.leds[0] + 1);
      e.hue = hue;
    }
    if (e.b === id) {
      e.leds[e.leds.length - 1] = Math.min(2, e.leds[e.leds.length - 1] + 1);
      e.hue = hue;
    }
  }
}

// Check for wave collision at a hub and create effects
function checkWaveCollision(node) {
  // Count active waves at neighboring hubs
  let neighborWaves = 0;
  let totalIntensity = 0;
  
  for (const e of edges) {
    let neighborId = null;
    if (e.a === node.id) neighborId = e.b;
    else if (e.b === node.id) neighborId = e.a;
    
    if (neighborId !== null) {
      const wave = waves.find(w => w.hubId === neighborId && w.intensity > 0.3);
      if (wave) {
        neighborWaves++;
        totalIntensity += wave.intensity;
      }
    }
  }
  
  // If multiple waves nearby, create collision effect!
  if (neighborWaves >= 2) {
    createCollisionEffect(node, totalIntensity);
  }
}

// Big visual effect when waves collide
function createCollisionEffect(node, intensity) {
  // Spawn lots of particles in multiple colors
  const colors = ['rgb(255, 100, 150)', 'rgb(100, 255, 218)', 'rgb(255, 220, 100)', 'rgb(150, 100, 255)'];
  for (const color of colors) {
    spawnParticles(node.sx, node.sy, color, Math.floor(8 * intensity));
  }
  
  // Play harmonic chord
  playTone(400, 0.3, 'sine', 0.2);
  playTone(500, 0.3, 'sine', 0.15);
  playTone(600, 0.3, 'sine', 0.1);
  
  // Bonus score for collision
  score += Math.floor(20 * intensity);
  if (intensity > 1.5) {
    showNotification('✨ Wave Collision! +' + Math.floor(20 * intensity), 'combo');
  }
  
  // Emit strong pulse in all directions
  emitPulse(node.id);
  emitPulse(node.id);
}

// Update Resonance waves
function updateResonance(dt) {
  if (game !== 'resonance') return;
  
  // Process each wave
  for (let i = waves.length - 1; i >= 0; i--) {
    const wave = waves[i];
    wave.age += dt;
    wave.intensity *= WAVE_FADE;
    
    // Propagate to neighbors if strong enough
    if (wave.intensity > WAVE_PROPAGATE_THRESHOLD && wave.age > WAVE_SPEED) {
      wave.age = 0;
      
      // Find neighbors and propagate
      for (const e of edges) {
        let neighborId = null;
        if (e.a === wave.hubId) neighborId = e.b;
        else if (e.b === wave.hubId) neighborId = e.a;
        
        if (neighborId !== null) {
          // Check if neighbor already has a wave
          const existingWave = waves.find(w => w.hubId === neighborId);
          const propagateIntensity = wave.intensity * 0.5;
          
          if (existingWave) {
            // Waves meeting - check for collision!
            if (existingWave.intensity > 0.2 && propagateIntensity > 0.2) {
              const node = nodes[neighborId];
              const combinedIntensity = existingWave.intensity + propagateIntensity;
              if (combinedIntensity > 0.8) {
                createCollisionEffect(node, combinedIntensity);
              }
            }
            existingWave.intensity = Math.min(2, existingWave.intensity + propagateIntensity * 0.3);
          } else if (propagateIntensity > 0.15) {
            waves.push({ hubId: neighborId, intensity: propagateIntensity, hue: wave.hue, age: 0 });
            emitPulseWithColor(neighborId, wave.hue);
          }
        }
      }
    }
    
    // Remove dead waves
    if (wave.intensity < 0.05) {
      waves.splice(i, 1);
    }
  }
}

function randomNeighbor(id) {
  const ns = [];
  for (const e of edges) {
    if (e.a === id) ns.push(e.b);
    else if (e.b === id) ns.push(e.a);
  }
  if (ns.length === 0) return null;
  return ns[Math.floor(Math.random() * ns.length)];
}

/* ============================================================
   LED PULSES
============================================================ */
function emitPulse(id) {
  for (const e of edges) {
    if (e.a === id) e.leds[0] = Math.min(2, e.leds[0] + 1);
    if (e.b === id) e.leds[e.leds.length - 1] = Math.min(2, e.leds[e.leds.length - 1] + 1);
  }
}

function updateLEDs() {
  const speed = Math.round(PULSE_SPEED);
  for (let s = 0; s < speed; s++) {
    for (const e of edges) {
      for (let i = e.leds.length - 1; i > 0; i--) {
        e.leds[i] = Math.max(e.leds[i], e.leds[i - 1] * LED_DECAY);
      }
      e.leds[0] *= LED_DECAY;
    }
  }
}

/* ============================================================
   3D -> 2D PROJECTION + AUTO-FIT
============================================================ */
function projectAll() {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;

  const cx = w * 0.5;
  const cy = h * 0.52;
  const pad = 26;

  const ry = rotY;
  const rx = rotX;
  const rz = rotZ;

  const cosy = Math.cos(ry), siny = Math.sin(ry);
  const cosx = Math.cos(rx), sinx = Math.sin(rx);
  const cosz = Math.cos(rz), sinz = Math.sin(rz);

  const tmp = [];
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;

  for (const n of nodes) {
    let [x,y,z] = n.p3;

    // First: rotate around Z axis (dome's vertical axis) - this is the "spin"
    let x0 = x * cosz - y * sinz;
    let y0 = x * sinz + y * cosz;

    // rotate Y (camera yaw)
    let x1 = x0 * cosy + z * siny;
    let z1 = -x0 * siny + z * cosy;

    // rotate X (camera pitch)
    let y2 = y0 * cosx - z1 * sinx;
    let z2 = y0 * sinx + z1 * cosx;

    // gentle depth scaling
    const depth = 0.75 + (z2 * 0.25);
    const px = x1 * depth;
    const py = y2 * depth;

    tmp.push([px, py]);

    if (px < minX) minX = px;
    if (px > maxX) maxX = px;
    if (py < minY) minY = py;
    if (py > maxY) maxY = py;
  }

  const spanX = Math.max(1e-6, maxX - minX);
  const spanY = Math.max(1e-6, maxY - minY);
  const scale = Math.min((w - pad*2) / spanX, (h - pad*2) / spanY);

  for (let i=0;i<nodes.length;i++) {
    const [px, py] = tmp[i];
    nodes[i].sx = cx + (px - (minX + maxX)/2) * scale;
    nodes[i].sy = cy + (py - (minY + maxY)/2) * scale;
  }
}

/* ============================================================
   RENDER
============================================================ */
let frameTime = 0;

function draw(timestamp) {
  frameTime = timestamp || 0;
  
  // Auto-rotate when enabled and not manually rotating
  // Spin the dome around its own vertical axis (Z)
  if (AUTO_ROTATE && !isRotating) {
    rotZ += 0.008;
  }
  
  resizeCanvasToDisplaySize();
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;

  projectAll();
  updateParticles();

  // Clear with slight fade for motion blur effect
  ctx.fillStyle = 'rgba(12, 16, 24, 0.95)';
  ctx.fillRect(0, 0, w, h);

  // Background glow - changes based on game state
  if (GLOW_ENABLED) {
    const gradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.5);
    
    if (game === 'chain' && chainLost) {
      // Red ominous glow when lost
      gradient.addColorStop(0, 'rgba(239, 68, 68, 0.08)');
      gradient.addColorStop(0.5, 'rgba(139, 0, 0, 0.05)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    } else if (game === 'chain' && chainWon) {
      // Golden celebration glow
      const pulse = Math.sin(celebrationTime * 3) * 0.02 + 0.05;
      gradient.addColorStop(0, `rgba(251, 191, 36, ${pulse})`);
      gradient.addColorStop(0.5, `rgba(16, 185, 129, ${pulse})`);
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    } else {
      gradient.addColorStop(0, 'rgba(100, 255, 218, 0.03)');
      gradient.addColorStop(0.5, 'rgba(124, 58, 237, 0.02)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);
  }

  // Sort edges by depth for proper rendering
  const sortedEdges = [...edges].sort((a, b) => {
    const za = (nodes[a.a].p3[2] + nodes[b.a].p3[2]) / 2;
    const zb = (nodes[a.b].p3[2] + nodes[b.b].p3[2]) / 2;
    return za - zb;
  });

  // Draw struts with gradient
  for (const e of sortedEdges) {
    const a = nodes[e.a], b = nodes[e.b];
    const avgZ = (a.p3[2] + b.p3[2]) / 2;
    const alpha = 0.3 + avgZ * 0.4;
    
    ctx.lineWidth = 2 + avgZ;
    const gradient = ctx.createLinearGradient(a.sx, a.sy, b.sx, b.sy);
    gradient.addColorStop(0, `rgba(38, 48, 77, ${alpha})`);
    gradient.addColorStop(0.5, `rgba(50, 60, 90, ${alpha})`);
    gradient.addColorStop(1, `rgba(38, 48, 77, ${alpha})`);
    ctx.strokeStyle = gradient;
    
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.lineTo(b.sx, b.sy);
    ctx.stroke();
  }

  // LEDs with glow effect
  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b];
    for (let i = 0; i < e.leds.length; i++) {
      const v = e.leds[i];
      if (v < 0.02) continue;
      
      const t = i / (e.leds.length - 1);
      const x = a.sx * (1-t) + b.sx * t;
      const y = a.sy * (1-t) + b.sy * t;
      const intensity = Math.min(v, 1);
      
      // Determine LED color based on game mode
      let ledColor, glowColor;
      if (game === 'chain') {
        if (chainWon) {
          // Rainbow LEDs during win
          const hue = (e.a * 30 + celebrationTime * 150 + i * 20) % 360;
          ledColor = `hsla(${hue}, 80%, 60%, ${intensity})`;
          glowColor = `hsla(${hue}, 80%, 60%, ${intensity * 0.5})`;
        } else if (chainLost) {
          // Red pulsing LEDs during loss
          ledColor = `rgba(239, 68, 68, ${intensity})`;
          glowColor = `rgba(239, 68, 68, ${intensity * 0.5})`;
        } else {
          // Green LEDs for chain reaction
          ledColor = `rgba(16, 185, 129, ${intensity})`;
          glowColor = `rgba(16, 185, 129, ${intensity * 0.5})`;
        }
      } else if (game === 'resonance' && e.hue !== undefined) {
        ledColor = `hsla(${e.hue}, 80%, 60%, ${intensity})`;
        glowColor = `hsla(${e.hue}, 80%, 60%, ${intensity * 0.5})`;
      } else {
        ledColor = `rgba(0, 220, 255, ${intensity})`;
        glowColor = `rgba(0, 200, 255, ${intensity * 0.5})`;
      }
      
      // Glow effect
      if (GLOW_ENABLED && v > 0.3) {
        const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, 15);
        glowGrad.addColorStop(0, glowColor);
        glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // LED core
      ctx.fillStyle = ledColor;
      ctx.beginPath();
      ctx.arc(x, y, 3 + intensity * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw particles
  drawParticles();

  // Sort hubs by depth
  const sortedNodes = [...nodes].sort((a, b) => a.p3[2] - b.p3[2]);

  // Hubs
  for (const n of sortedNodes) {
    const depth = 0.6 + n.p3[2] * 0.4;
    const radius = HUB_RADIUS * depth;
    const isHovered = n.id === hoveredHub;
    const adjacentTeams = game === "pulsewars" ? getAdjacentTeams(n.id) : [];
    const isFrontier = adjacentTeams.length > 0;
    const isContested = adjacentTeams.length > 1; // Both teams adjacent!
    
    // Determine color
    let baseColor, glowColor;
    
    // Chain Reaction coloring
    if (game === "chain") {
      const isTarget = n.id === chainTargetHub && !n.chainLit;
      
      if (chainWon) {
        // Victory animation - rainbow cycle
        const hue = (n.id * 30 + celebrationTime * 200) % 360;
        baseColor = `hsl(${hue}, 80%, 60%)`;
        glowColor = `hsla(${hue}, 80%, 60%, 0.6)`;
      } else if (chainLost) {
        // Failure animation - pulsing red
        const pulse = Math.sin(celebrationTime * 10) * 0.3 + 0.7;
        baseColor = `rgba(239, 68, 68, ${pulse})`;
        glowColor = `rgba(239, 68, 68, ${pulse * 0.6})`;
      } else if (n.chainLit) {
        // Lit hubs glow green
        baseColor = '#10b981';
        glowColor = 'rgba(16, 185, 129, 0.6)';
      } else if (isTarget) {
        // Target hub - bright golden/yellow
        baseColor = '#fbbf24';
        glowColor = 'rgba(251, 191, 36, 0.7)';
      } else if (isHovered) {
        baseColor = '#a78bfa';
        glowColor = 'rgba(167, 139, 250, 0.4)';
      } else {
        // Unlit hubs
        baseColor = `rgba(80, 90, 110, ${0.5 + depth * 0.3})`;
        glowColor = null;
      }
    } else if (game === "pulsewars") {
      if (n.capturedBy === 1) {
        // Captured by Red
        baseColor = '#f43f5e';
        glowColor = 'rgba(244, 63, 94, 0.5)';
      } else if (n.capturedBy === 2) {
        // Captured by Blue
        baseColor = '#3b82f6';
        glowColor = 'rgba(59, 130, 246, 0.5)';
      } else if (isFrontier && isHovered) {
        // Hovering over valid frontier
        if (isContested) {
          baseColor = '#c4b5fd'; // Purple for contested
          glowColor = 'rgba(196, 181, 253, 0.4)';
        } else {
          const hoverTeam = adjacentTeams[0];
          baseColor = hoverTeam === 1 ? '#fda4af' : '#93c5fd';
          glowColor = hoverTeam === 1 ? 'rgba(244, 63, 94, 0.4)' : 'rgba(59, 130, 246, 0.4)';
        }
      } else {
        // Neutral hub
        baseColor = `rgba(80, 90, 110, ${0.5 + depth * 0.3})`;
        glowColor = null;
      }
    } else if (n.pressedBy.size > 0) {
      baseColor = '#10b981';
      glowColor = 'rgba(16, 185, 129, 0.6)';
    } else if (isHovered) {
      baseColor = '#a78bfa';
      glowColor = 'rgba(167, 139, 250, 0.4)';
    } else {
      baseColor = `rgba(120, 130, 160, ${0.4 + depth * 0.3})`;
      glowColor = null;
    }
    
    // Draw glow for special hubs
    if (GLOW_ENABLED && glowColor) {
      const glowRadius = radius * 2.5;
      const gradient = ctx.createRadialGradient(n.sx, n.sy, radius * 0.5, n.sx, n.sy, glowRadius);
      gradient.addColorStop(0, glowColor);
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, glowRadius, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Draw hub with gradient
    const hubGrad = ctx.createRadialGradient(
      n.sx - radius * 0.3, n.sy - radius * 0.3, 0,
      n.sx, n.sy, radius
    );
    hubGrad.addColorStop(0, baseColor);
    hubGrad.addColorStop(1, typeof baseColor === 'string' && baseColor.startsWith('#') 
      ? baseColor + '99' : baseColor);
    
    ctx.beginPath();
    ctx.arc(n.sx, n.sy, radius, 0, Math.PI * 2);
    ctx.fillStyle = hubGrad;
    ctx.fill();
    
    // Add highlight
    ctx.beginPath();
    ctx.arc(n.sx - radius * 0.25, n.sy - radius * 0.25, radius * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fill();
    
    // Pulse Wars: Draw LED ring around hub
    if (game === "pulsewars") {
      const ringRadius = radius + 6;
      const ledSize = 3 * depth;
      
      // Draw ring background (dim LEDs)
      for (let i = 0; i < RING_LEDS; i++) {
        const angle = (Math.PI * 2 / RING_LEDS) * i - Math.PI / 2;
        const lx = n.sx + Math.cos(angle) * ringRadius;
        const ly = n.sy + Math.sin(angle) * ringRadius;
        
        ctx.beginPath();
        ctx.arc(lx, ly, ledSize, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(40, 50, 70, 0.8)';
        ctx.fill();
      }
      
      // Draw lit LEDs based on charge
      if (n.ringCharge > 0 || n.capturedBy) {
        const litCount = n.capturedBy ? RING_LEDS : Math.floor(n.ringCharge);
        const ledColor = (n.chargeTeam === 1 || n.capturedBy === 1) ? '#f43f5e' : '#3b82f6';
        
        for (let i = 0; i < litCount; i++) {
          const angle = (Math.PI * 2 / RING_LEDS) * i - Math.PI / 2;
          const lx = n.sx + Math.cos(angle) * ringRadius;
          const ly = n.sy + Math.sin(angle) * ringRadius;
          
          // Glow
          if (GLOW_ENABLED) {
            const glowGrad = ctx.createRadialGradient(lx, ly, 0, lx, ly, ledSize * 3);
            glowGrad.addColorStop(0, ledColor + 'aa');
            glowGrad.addColorStop(1, ledColor + '00');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(lx, ly, ledSize * 3, 0, Math.PI * 2);
            ctx.fill();
          }
          
          // LED
          ctx.beginPath();
          ctx.arc(lx, ly, ledSize, 0, Math.PI * 2);
          ctx.fillStyle = ledColor;
          ctx.fill();
        }
      }
      
      // Pulsing ring for frontier hubs
      if (isFrontier && !gameOver && n.capturedBy === null) {
        const pulse = Math.sin(frameTime * 0.006) * 0.5 + 0.5;
        
        if (isContested) {
          // Contested - show both colors alternating
          const altPulse = Math.sin(frameTime * 0.01);
          const contestColor = altPulse > 0 ? 'rgba(244, 63, 94,' : 'rgba(59, 130, 246,';
          ctx.beginPath();
          ctx.arc(n.sx, n.sy, ringRadius + 4 + pulse * 6, 0, Math.PI * 2);
          ctx.strokeStyle = contestColor + (0.4 + pulse * 0.5) + ')';
          ctx.lineWidth = 3;
          ctx.stroke();
        } else {
          // Single team frontier
          const frontierTeam = adjacentTeams[0];
          const frontierColor = frontierTeam === 1 ? 'rgba(244, 63, 94,' : 'rgba(59, 130, 246,';
          ctx.beginPath();
          ctx.arc(n.sx, n.sy, ringRadius + 4 + pulse * 4, 0, Math.PI * 2);
          ctx.strokeStyle = frontierColor + (0.3 + pulse * 0.5) + ')';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }
    
    // Pulsing ring for TARGET hub in Chain Reaction (the one to hit!)
    if (game === 'chain' && n.id === chainTargetHub && !n.chainLit && !chainWon && !chainLost) {
      const ringPulse = Math.sin(frameTime * 0.008) * 0.5 + 0.5;
      
      // Outer pulsing ring
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, radius + 5 + ringPulse * 8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(251, 191, 36, ${0.4 + ringPulse * 0.6})`;
      ctx.lineWidth = 3;
      ctx.stroke();
      
      // Inner ring
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, radius + 2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 255, 255, 0.8)`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // Subtle ring for lit hubs in Chain Reaction
    if (game === 'chain' && n.chainLit && !chainWon && !chainLost) {
      const ringPulse = Math.sin(frameTime * 0.005 + n.id) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, radius + 3 + ringPulse * 2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(16, 185, 129, ${0.3 + ringPulse * 0.3})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // Resonance wave glow on hubs
    if (game === 'resonance') {
      const wave = waves.find(w => w.hubId === n.id);
      if (wave && wave.intensity > 0.1) {
        const waveGlow = ctx.createRadialGradient(n.sx, n.sy, radius * 0.5, n.sx, n.sy, radius * 3);
        waveGlow.addColorStop(0, `hsla(${wave.hue}, 80%, 60%, ${wave.intensity * 0.6})`);
        waveGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = waveGlow;
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, radius * 3, 0, Math.PI * 2);
        ctx.fill();
        
        // Pulsing ring
        const pulse = Math.sin(frameTime * 0.01) * 0.5 + 0.5;
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, radius + 2 + wave.intensity * 6 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${wave.hue}, 80%, 70%, ${wave.intensity * 0.8})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  // Update game state
  const dt = 1/60; // Approximate frame time
  updatePulseWars(dt);
  updateResonance(dt);
  pulseWarsTimer += dt;
  
  // Chain Reaction timer and animations
  if (game === 'chain') {
    if (chainWon || chainLost) {
      celebrationTime += dt;
      
      // Win animation - spawn rainbow fireworks
      if (chainWon && celebrationTime < 5) {
        if (Math.random() < 0.15) {
          const rn = nodes[Math.floor(Math.random() * nodes.length)];
          const hue = Math.random() * 360;
          spawnParticles(rn.sx, rn.sy, `hsl(${hue}, 80%, 60%)`, 20);
          if (Math.random() < 0.3) playTone(400 + Math.random() * 600, 0.1, 'sine', 0.2);
        }
      }
      
      // Lose animation - red overlay and sparks
      if (chainLost) {
        // Red vignette overlay
        const pulseAlpha = Math.sin(celebrationTime * 3) * 0.1 + 0.2;
        const vignette = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vignette.addColorStop(0.5, `rgba(239, 68, 68, ${pulseAlpha * 0.3})`);
        vignette.addColorStop(1, `rgba(139, 0, 0, ${pulseAlpha})`);
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, w, h);
        
        // Falling red embers
        if (celebrationTime < 3 && Math.random() < 0.1) {
          const rn = nodes[Math.floor(Math.random() * nodes.length)];
          spawnParticles(rn.sx, rn.sy, 'rgba(239, 68, 68, 0.8)', 5);
        }
      }
      
      // Win overlay - golden shimmer
      if (chainWon) {
        const shimmer = Math.sin(celebrationTime * 5) * 0.05 + 0.1;
        const winGlow = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.5);
        winGlow.addColorStop(0, `rgba(251, 191, 36, ${shimmer})`);
        winGlow.addColorStop(0.5, `rgba(16, 185, 129, ${shimmer * 0.5})`);
        winGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = winGlow;
        ctx.fillRect(0, 0, w, h);
      }
    } else if (chainStarted && chainTimeRemaining > 0) {
      // Count down timer
      chainTimeRemaining -= dt;
      
      // Urgency effects when low on time
      if (chainTimeRemaining <= 5 && chainTimeRemaining > 0) {
        if (Math.floor(chainTimeRemaining) !== Math.floor(chainTimeRemaining + dt)) {
          playTone(600, 0.1, 'square', 0.3); // Tick sound
        }
      }
      
      // Time's up!
      if (chainTimeRemaining <= 0) {
        chainTimeRemaining = 0;
        chainLost = true;
        celebrationTime = 0;
        showNotification('💔 TIME UP! Try again!', 'error');
        playFailSound();
      }
      
      updateUI();
    }
  }
  
  // Periodic UI update for Pulse Wars
  if (game === 'pulsewars' && Math.floor(pulseWarsTimer * 2) !== Math.floor((pulseWarsTimer - dt) * 2)) {
    updateUI();
  }

  updateLEDs();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
